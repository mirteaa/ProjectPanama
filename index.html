        .email-button {

            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            background-color: #CE6246;
            text-decoration: none;
            border-radius: 5px;
            font-family: sans-serif;
            font-weight: 500;
            transition: background-color 160ms ease, color 160ms ease;
        }
        .email-button:hover {
            background-color: #E5BDA8;
            color: #101010;
        }
        .email-button:focus-visible {
            outline: 2px solid #F9F8F2;
            outline-offset: 3px;
        }
        @media (max-width: 520px) {
            body { padding: 32px 14px; }
            .container { padding: 12px; }
            .email-button { font-size: 1.05rem; padding: 14px 22px; }
        }
    </style>
</head>

const ANTHROPIC_SUBJECT = "Urgent Request to End Destructive Scanning in Project Panama";
const ANTHROPIC_BODY = `Dear Anthropic Leadership,

I am writing to express my deep concern regarding "Project Panama" and the use of destructive scanning to digitize rare and antique books.

The destruction of physical, irreplaceable literary artifacts is a loss to our shared human history. While I understand the technical and legal arguments that high-fidelity, comprehensive digitization is necessary for fair use to apply and for AI models to be effectively trained, this goal should not come at the cost of the physical record.

Innovation should not require the erasure of the very history it seeks to analyze. I urge Anthropic to immediately cease the destruction of rare books and pivot toward non-destructive scanning methods, regardless of the increased time or cost. Our cultural heritage is a non-renewable resource.

Sincerely,

[Your Name]`;

const CONGRESS_SUBJECT = "Request for Legislation to Ban Destructive Scanning of Cultural Heritage";
const CONGRESS_BODY = `Dear Representative or Senator,

I am writing to urge you to introduce or support legislation that bans the "destructive scanning" of rare, antique, and culturally significant books for the purpose of AI training.

Current legal precedents, including those seen in the discourse surrounding Bartz v. Anthropic, highlight a dangerous gap in our laws. We are seeing the physical destruction of irreplaceable historical artifacts to feed AI datasets. While the AI industry argues that such access is necessary to qualify for "fair use" and to ensure the accuracy of their models, the permanent loss of a physical book is an unacceptable price for a digital dataset.

The preservation of our physical literary history must be legally prioritized over the efficiency of AI data acquisition. I ask that you work with the House Committee on the Judiciary to establish clear protections that outlaw the destruction of rare books during the digitization process.

I look forward to hearing how you intend to protect our nation's cultural heritage from this modern form of book burning.

Sincerely,

[Your Name]
[Your Address/City/State]`;

function buildMailto(recipients, subject, body) {
  return "mailto:?bcc=" + recipients.join(",") +
    "&subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
}

function congressRecipients(now) {
  const newCongressStart = new Date(2027, 0, 3, 0, 0, 0, 0);
  return now >= newCongressStart
    ? HOUSE_AFTER.concat(SENATE_AFTER)
    : HOUSE_BEFORE.concat(SENATE_BEFORE);
}

document.getElementById("anthropic-email").href =
  buildMailto(ANTHROPIC_EMAILS, ANTHROPIC_SUBJECT, ANTHROPIC_BODY);

document.getElementById("congress-email").href =
  buildMailto(congressRecipients(new Date()), CONGRESS_SUBJECT, CONGRESS_BODY);
